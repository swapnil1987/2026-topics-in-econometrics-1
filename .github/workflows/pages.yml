name: Publish lecture slides

on:
  push:
    branches:
      - main
    paths:
      - "slides/**"
      - "environment.yml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Create course environment
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: environment.yml
          environment-name: topics-econometrics
          cache-environment: true
          cache-downloads: true

      - name: Render lecture slides
        run: micromamba run --name topics-econometrics quarto render slides

      - name: Make Lecture 1 the site landing page
        run: cp slides/_site/lecture-01.html slides/_site/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload rendered site
        uses: actions/upload-pages-artifact@v4
        with:
          path: slides/_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
